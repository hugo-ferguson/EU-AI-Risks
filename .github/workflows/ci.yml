name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Syntax Check
        run: |
          python3 -c 'import ast,pathlib; files=list(pathlib.Path("eu_ai_risks").rglob("*.py")); [ast.parse(p.read_text(), filename=str(p)) for p in files]; print(f"Parsed {len(files)} Python files")'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic fastapi uvicorn python-dotenv jinja2 pytest pytest-asyncio litellm neo4j pdfplumber typer python-multipart

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v
