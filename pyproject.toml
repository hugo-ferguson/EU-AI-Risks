[project]
name = "eu-ai-risks"
version = "0.1.0"
description = "Parse the EU AI Act into a Neo4j graph database."
requires-python = ">=3.12"
dependencies = [
    "litellm",
    "tenacity",
    "neo4j",
    "pdfplumber",
    "python-docx",
    "python-dotenv",
    "sentence-transformers",
    "typer",
    "python-multipart",
    "jinja2",
    "uvicorn",
    "fastapi",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["eu_ai_risks*"]

[project.scripts]
eu-ai-risks = "eu_ai_risks.cli:main"

[tool.setuptools.package-data]
eu_ai_risks = ["web/templates/*.html", "web/static/*"]
