[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-ai-risks"
version = "0.1.0"
description = "Parse the EU AI Act into a Neo4j graph database and assess software requirements."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "litellm",
    "tenacity",
    "neo4j",
    "pdfplumber",
    "python-docx",
    "python-dotenv",
    "sentence-transformers",
    "typer",
    "python-multipart",
    "jinja2",
    "uvicorn",
    "fastapi",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
]
jev = [
    "typesafe-sdk>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["eu_ai_risks*"]

[project.scripts]
eu-ai-risks = "eu_ai_risks.cli:main"

[tool.setuptools.package-data]
eu_ai_risks = ["web/templates/*.html", "web/static/*"]
